<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c10" />
    <meta
      name="description"
      content="Shrink any video to fit any upload limit — 100% local in your browser, nothing gets uploaded."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Limbo Encoder" />
    <meta property="og:title" content="Limbo Encoder" />
    <meta
      property="og:description"
      content="Shrink any video to fit any upload limit — 100% local in your browser, nothing gets uploaded."
    />
    <meta property="og:url" content="https://limbo-encoder.netlify.app/" />
    <!-- ?v=2 busts scraper caches (Discord etc.) that key on the exact URL. -->
    <meta property="og:image" content="https://limbo-encoder.netlify.app/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Limbo Encoder" />
    <meta
      name="twitter:description"
      content="Shrink any video to fit any upload limit — 100% local in your browser, nothing gets uploaded."
    />
    <meta name="twitter:image" content="https://limbo-encoder.netlify.app/og-image.png?v=2" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      ffmpeg.wasm UMD runtime, served same-origin (see scripts/copy-ffmpeg-assets.js).
      Must load before the app bundle, which reads window.FFmpegWASM.
    -->
    <script src="%PUBLIC_URL%/ffmpeg/%REACT_APP_FFMPEG_CORE%/ffmpeg.js"></script>
    <script src="%PUBLIC_URL%/ffmpeg/%REACT_APP_FFMPEG_DEMUX%/mp4box.all.min.js"></script>
    <script src="%PUBLIC_URL%/ffmpeg/%REACT_APP_FFMPEG_DEMUX%/mp4-muxer.js"></script>
    <!--
      Ko-fi donation widget. crossorigin makes it a CORS request (the CDN
      sends ACAO: *), which is what lets it through the COEP isolation
      below. Purely cosmetic: if it fails (offline, CDN down), the app
      renders without the button.
    -->
    <script src="https://storage.ko-fi.com/cdn/widget/Widget_2.js" crossorigin="anonymous"></script>
    <title>Limbo Encoder</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
